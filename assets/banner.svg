<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Utility Forge">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="260" fill="url(#bg)"/>

  <!-- anvil silhouette, kept low and small so it never competes with the text block -->
  <g fill="#28374d">
    <polygon points="455,228 562,203 562,228"/>
    <rect x="562" y="196" width="150" height="32"/>
    <rect x="712" y="186" width="22" height="15"/>
    <rect x="612" y="228" width="40" height="16"/>
    <polygon points="582,244 682,244 702,259 562,259"/>
  </g>

  <!-- small sparks struck off the anvil -->
  <g fill="url(#spark)">
    <polygon points="515,158 523,172 515,186 507,172"/>
    <circle cx="545" cy="180" r="3.5"/>
    <circle cx="500" cy="196" r="2.5"/>
  </g>

  <!-- accent strips, one per tool currently in the collection -->
  <rect x="0" y="0" width="10" height="260" fill="#3b82f6"/>
  <rect x="1190" y="0" width="10" height="260" fill="#d80101"/>

  <text x="600" y="70" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" letter-spacing="7" fill="#94a3b8">STANDALONE · PRIVACY-FIRST</text>

  <text x="600" y="122" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="54" font-weight="700" letter-spacing="3" fill="#f8fafc">UTILITY FORGE</text>

  <text x="600" y="155" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#cbd5e1">One repository. Every tool self-contained. Open it and it just works.</text>
</svg>
